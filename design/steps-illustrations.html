<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Step Illustrations — wePOS for Dokan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Design preview only (not part of the site build). Graphical illustrations for the
       "Live at your vendors' counters in three steps" cards, in three styles. */
    :root { --accent: #7047EB; --blue: #2A5AFA; --ink: #1E1B4B; --slate-900: #0F172A; --how-bg: #F3F4F8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--slate-900); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .opt { padding: 56px 24px 96px; background: var(--how-bg); border-top: 1px dashed #D4D4D8; }
    .opt:first-of-type { border-top: 0; }
    .opt-label { max-width: 1120px; margin: 0 auto 36px; display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #52525B; }
    .opt-label b { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: #141317; color: #fff; font-weight: 500; }
    body.single .opt { border: 0; padding-top: 48px; }
    .h2 { text-align: center; font-family: 'Poppins'; font-weight: 700; font-size: 44px; line-height: 1.16; letter-spacing: -.02em; margin: 0 auto 64px; max-width: 20ch; }

    /* Cards: same size, tilt and type as the live section */
    .steps { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: start; }
    .card { display: flex; flex-direction: column; min-height: 470px; padding: 30px 30px 34px; background: #fff; border: 1px solid #E6E7EC; border-radius: 14px; }
    .steps .card:nth-child(1) { transform: rotate(-3.5deg) translateY(26px); }
    .steps .card:nth-child(2) { transform: translateY(-4px); }
    .steps .card:nth-child(3) { transform: rotate(3deg) translateY(22px); }
    .num { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #6B7080; }
    .card h3 { font-weight: 500; font-size: 32px; line-height: 1.22; letter-spacing: -.025em; margin: 14px 0 0; max-width: 12ch; }
    .card p { font-size: 15px; line-height: 1.55; color: #5B6170; margin: auto 0 0; padding-top: 24px; max-width: 32ch; }
    .art { margin-top: 22px; border-radius: 14px; aspect-ratio: 280 / 180; display: grid; place-items: center; overflow: hidden; }
    .art svg { width: 100%; height: 100%; display: block; }

    /* ── Style 1: flat colour ── */
    .flat .art { background: #F4F2FE; }
    .flat .f1 { fill: #7047EB; } .flat .f2 { fill: #2A5AFA; } .flat .f3 { fill: #DCD3FD; } .flat .f4 { fill: #fff; }
    .flat .d { fill: #1E1B4B; } .flat .m { fill: #C9CCD6; } .flat .sh { fill: rgba(30,27,75,.10); }
    .flat .skin { fill: #F3C6A5; } .flat .hair { fill: #2B2340; } .flat .ok { fill: #16A34A; } .flat .gold { fill: #F5B83D; } .flat .gold2 { fill: #E09B18; }
    .flat .ln { fill: none; stroke: #1E1B4B; stroke-width: 4; stroke-linecap: round; }
    .flat .mo { fill: none; stroke: #7047EB; stroke-width: 3; stroke-linecap: round; }
    .flat .wl { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .flat .spark { fill: #F5B83D; } .flat .blob { fill: none; }

    /* ── Style 2: line art on soft colour ── */
    .line .art { background: #fff; border: 1px solid #EEF0F4; }
    .line .blob { fill: #EFEAFE; }
    .line :is(.f1, .f2, .f3, .f4, .d, .m, .skin, .hair, .ok, .gold, .gold2) { stroke: #1E1B4B; stroke-width: 2.2; stroke-linejoin: round; }
    .line .f1 { fill: #CFC2FC; } .line .f2 { fill: #C7D6FF; } .line .f3 { fill: #fff; } .line .f4 { fill: #fff; }
    .line .d { fill: #1E1B4B; stroke: none; } .line .m { fill: #fff; } .line .sh { fill: none; }
    .line .skin { fill: #fff; } .line .hair { fill: #1E1B4B; } .line .ok { fill: #BBF0CF; } .line .gold, .line .gold2 { fill: #FFE7A8; }
    .line .ln { fill: none; stroke: #1E1B4B; stroke-width: 2.2; stroke-linecap: round; }
    .line .mo { fill: none; stroke: #7047EB; stroke-width: 2.2; stroke-linecap: round; }
    .line .wl { fill: none; stroke: #1E1B4B; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .line .spark { fill: #7047EB; }

    /* ── Style 3: soft gradient with depth ── */
    .soft .art { background: radial-gradient(120% 100% at 50% 0%, #EFEAFF 0%, #F7F8FB 60%); }
    .soft .f1 { fill: url(#g-purple); } .soft .f2 { fill: url(#g-blue); } .soft .f3 { fill: url(#g-lilac); } .soft .f4 { fill: #fff; }
    .soft .d { fill: #2A2458; } .soft .m { fill: url(#g-metal); } .soft .sh { fill: url(#g-shadow); }
    .soft .skin { fill: url(#g-skin); } .soft .hair { fill: #2B2340; } .soft .ok { fill: url(#g-green); } .soft .gold { fill: url(#g-gold); } .soft .gold2 { fill: #D98E10; }
    .soft .ln { fill: none; stroke: #2A2458; stroke-width: 4; stroke-linecap: round; }
    .soft .mo { fill: none; stroke: #9B82F5; stroke-width: 3; stroke-linecap: round; }
    .soft .wl { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .soft .spark { fill: #B9A6FA; } .soft .blob { fill: none; }
    .soft .lift { filter: drop-shadow(0 10px 14px rgba(76, 52, 180, .22)); }
  </style>
</head>
<body>
  <!-- Shared gradients for style 3 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A7BFF"/><stop offset="1" stop-color="#5B2FD9"/></linearGradient>
      <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5F86FF"/><stop offset="1" stop-color="#1F45D6"/></linearGradient>
      <linearGradient id="g-lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2DAFF"/></linearGradient>
      <linearGradient id="g-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F2F6"/><stop offset="1" stop-color="#B9BDCB"/></linearGradient>
      <linearGradient id="g-skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAD6BC"/><stop offset="1" stop-color="#E9B08A"/></linearGradient>
      <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D27A"/><stop offset="1" stop-color="#109447"/></linearGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD66B"/><stop offset="1" stop-color="#E9A21C"/></linearGradient>
      <radialGradient id="g-shadow"><stop offset="0" stop-color="rgba(46,30,120,.22)"/><stop offset="1" stop-color="rgba(46,30,120,0)"/></radialGradient>
    </defs>
  </svg>

  <div id="root"></div>

  <script>
    const spark = (x, y, s = 1) => `<path class="spark" transform="translate(${x} ${y}) scale(${s})" d="M0 -7 C1 -2 2 -1 7 0 C2 1 1 2 0 7 C-1 2 -2 1 -7 0 C-2 -1 -1 -2 0 -7Z"/>`;

    /* 1. Install wePOS: a plug about to go into the wePOS socket */
    const INSTALL = `
      <ellipse class="blob" cx="140" cy="92" rx="104" ry="70"/>
      <ellipse class="sh" cx="140" cy="160" rx="112" ry="11"/>
      <path class="ln" d="M222 96 C248 96 240 146 270 146"/>
      <g class="lift">
        <rect class="f1" x="36" y="44" width="92" height="104" rx="22"/>
        <rect class="f3" x="49" y="57" width="66" height="78" rx="16"/>
        <rect class="d" x="66" y="82" width="32" height="8" rx="4"/>
        <rect class="d" x="66" y="102" width="32" height="8" rx="4"/>
      </g>
      <g class="lift">
        <rect class="m" x="136" y="82" width="30" height="8" rx="4"/>
        <rect class="m" x="136" y="102" width="30" height="8" rx="4"/>
        <rect class="f2" x="160" y="68" width="62" height="56" rx="15"/>
        <rect class="f4" x="174" y="82" width="22" height="5" rx="2.5" opacity=".55"/>
        <rect class="f4" x="174" y="92" width="14" height="5" rx="2.5" opacity=".55"/>
      </g>
      <path class="mo" d="M123 70 l7 -7 M125 96 h8 M123 122 l7 7"/>
      <circle class="ok" cx="122" cy="48" r="14"/>
      <path class="wl" d="M115.5 48 l4.5 4.5 l8 -9"/>
      ${spark(232, 46, 1.1)}${spark(26, 34, .8)}${spark(252, 72, .6)}`;

    /* 2. Set up outlets and cashiers: two shopfronts with cashiers in front */
    const shop = (x, y, w, h) => {
      const aw = w + 12, n = 6, sw = aw / n;
      let stripes = "", scallops = "";
      for (let i = 0; i < n; i++) {
        if (i % 2) stripes += `<rect class="f4" x="${x - 6 + i * sw}" y="${y - 16}" width="${sw}" height="18"/>`;
        scallops += `<circle class="${i % 2 ? "f4" : "f1"}" cx="${x - 6 + i * sw + sw / 2}" cy="${y + 2}" r="${sw / 2}"/>`;
      }
      return `<g class="lift">
        <rect class="f3" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>
        <rect class="f2" x="${x + w / 2 - 13}" y="${y + h - 36}" width="26" height="36" rx="4"/>
        <rect class="f4" x="${x + 9}" y="${y + 20}" width="${w / 2 - 24}" height="18" rx="3"/>
        <rect class="f4" x="${x + w / 2 + 15}" y="${y + 20}" width="${w / 2 - 24}" height="18" rx="3"/>
        <rect class="f1" x="${x - 6}" y="${y - 16}" width="${aw}" height="18" rx="5"/>
        ${stripes}${scallops}
      </g>`;
    };
    const person = (cx, top, body, shirt) => `<g class="lift">
        <rect class="${shirt}" x="${cx - 15}" y="${top + 22}" width="30" height="${body}" rx="14"/>
        <circle class="skin" cx="${cx}" cy="${top + 11}" r="11"/>
        <path class="hair" d="M${cx - 11} ${top + 10} a11 11 0 0 1 22 0 c-6 -3 -14 -3 -22 0z"/>
        <rect class="f4" x="${cx - 8}" y="${top + 32}" width="10" height="7" rx="2"/>
      </g>`;
    const OUTLETS = `
      <ellipse class="blob" cx="140" cy="92" rx="108" ry="70"/>
      <ellipse class="sh" cx="140" cy="160" rx="118" ry="11"/>
      ${shop(156, 76, 86, 76)}
      ${shop(34, 64, 100, 88)}
      ${person(128, 98, 52, "f2")}
      ${person(166, 106, 44, "f1")}
      <circle class="ok" cx="234" cy="44" r="14"/>
      <path class="wl" d="M227.5 44 l4.5 4.5 l8 -9"/>
      ${spark(24, 40, .8)}${spark(258, 92, .6)}`;

    /* 3. Start selling: a register printing a receipt, coins and a sync badge */
    const SELL = `
      <ellipse class="blob" cx="140" cy="92" rx="108" ry="70"/>
      <ellipse class="sh" cx="140" cy="164" rx="118" ry="10"/>
      <g class="lift">
        <path class="f4" d="M86 100 V50 l5 -5 l5 5 l5 -5 l5 5 l5 -5 l5 5 l5 -5 l5 5 l5 -5 l5 5 V100 Z"/>
        <rect class="f3" x="94" y="60" width="28" height="4" rx="2"/>
        <rect class="f3" x="94" y="70" width="20" height="4" rx="2"/>
        <rect class="f3" x="94" y="80" width="30" height="4" rx="2"/>
      </g>
      <g class="lift">
        <rect class="d" x="174" y="84" width="12" height="18" rx="3"/>
        <rect class="f2" x="150" y="44" width="62" height="44" rx="8"/>
        <rect class="f4" x="159" y="54" width="30" height="5" rx="2.5" opacity=".7"/>
        <rect class="f4" x="159" y="65" width="20" height="5" rx="2.5" opacity=".7"/>
        <path class="f1" d="M60 150 L74 100 H206 L220 150 Z"/>
        <g class="f4" opacity=".75">
          <rect x="92" y="112" width="14" height="8" rx="2.5"/><rect x="112" y="112" width="14" height="8" rx="2.5"/><rect x="132" y="112" width="14" height="8" rx="2.5"/>
          <rect x="88" y="126" width="14" height="8" rx="2.5"/><rect x="108" y="126" width="14" height="8" rx="2.5"/><rect x="128" y="126" width="14" height="8" rx="2.5"/>
        </g>
        <rect class="f2" x="54" y="148" width="172" height="14" rx="4"/>
        <rect class="f4" x="126" y="153" width="28" height="4" rx="2"/>
      </g>
      <g class="lift">
        <ellipse class="gold2" cx="244" cy="152" rx="15" ry="5.5"/><rect class="gold" x="229" y="143" width="30" height="9"/><ellipse class="gold" cx="244" cy="143" rx="15" ry="5.5"/>
        <ellipse class="gold2" cx="244" cy="138" rx="15" ry="5.5"/><rect class="gold" x="229" y="129" width="30" height="9"/><ellipse class="gold" cx="244" cy="129" rx="15" ry="5.5"/>
      </g>
      <circle class="ok" cx="236" cy="62" r="17"/>
      <path class="wl" d="M228 59 a9 9 0 0 1 15 -3 M244 65 a9 9 0 0 1 -15 3 M243 51 v5 h-5 M229 73 v-5 h5"/>
      ${spark(40, 46, .9)}${spark(30, 100, .6)}`;

    const STEPS = [
      ["Install wePOS", "Add wePOS to your Dokan Powered Marketplace and activate your lifetime license.", INSTALL],
      ["Set up outlets and cashiers", "Assign outlets to vendors and give staff a cashier login.", OUTLETS],
      ["Start selling", "Vendors ring up sales at the counter, and stock updates across your store.", SELL],
    ];
    const OPTIONS = [
      ["flat", "Flat colour: solid purple and blue shapes on a soft lilac panel"],
      ["line", "Line art: dark outlines with soft colour fills, on a white panel"],
      ["soft", "Soft gradient: gradients, gentle shadows and depth"],
    ];
    document.getElementById("root").innerHTML = OPTIONS.map(([cls, label], i) => `
      <section class="opt ${cls}" id="o${i + 1}">
        <div class="opt-label"><b>${i + 1}</b>${label}</div>
        <h2 class="h2">Live at your vendors' counters in three steps</h2>
        <div class="steps">
          ${STEPS.map(([t, b, art], j) => `
            <div class="card">
              <span class="num">0${j + 1}</span>
              <h3>${t}</h3>
              <div class="art"><svg viewBox="0 0 280 180" role="img" aria-label="${t}">${art}</svg></div>
              <p>${b}</p>
            </div>`).join("")}
        </div>
      </section>`).join("");

    const only = new URLSearchParams(location.search).get("only");
    if (only) { document.body.classList.add("single"); document.querySelectorAll(".opt").forEach((s) => { if (s.id !== "o" + only) s.remove(); }); }
  </script>
</body>
</html>
