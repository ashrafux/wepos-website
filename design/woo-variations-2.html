<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WooCommerce Section Options 7–10 — wePOS for Dokan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Design preview only (not part of the site build). Same tokens as the For Dokan page. */
    :root {
      --accent: #7047EB; --accent-deep: #5C32D4; --accent-soft: #F3F0FD; --blue: #2A5AFA;
      --ink: #141317; --slate-900: #0F172A; --slate-700: #334155; --slate-600: #475569; --slate-500: #64748B;
      --hair: #E7E7EA; --soft: #F7F7FA; --grey: #ECEEF0; --hero: #D7D9E2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--slate-900); font-family: 'Lato', sans-serif; -webkit-font-smoothing: antialiased; }
    img { display: block; max-width: 100%; height: auto; }
    ul { list-style: none; margin: 0; padding: 0; }
    .opt { padding: 56px 24px 96px; border-top: 1px dashed #D4D4D8; overflow-x: clip; }
    .opt:first-of-type { border-top: 0; }
    .opt-label { max-width: 1272px; margin: 0 auto 28px; display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #52525B; }
    .opt-label b { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 500; }
    .wrap { max-width: 1272px; margin: 0 auto; }
    body.single .opt { border: 0; padding-top: 40px; }

    h2 { font-family: 'Poppins'; font-weight: 700; letter-spacing: -.02em; line-height: 1.14; margin: 0; }
    .lead { font-size: 18px; line-height: 1.6; color: var(--slate-600); margin: 16px 0 0; }
    .center { text-align: center; }
    .center .lead { max-width: 60ch; margin-left: auto; margin-right: auto; }
    .ic { flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .ic svg { width: 21px; height: 21px; }
    .tick { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
    .pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 999px; background: var(--soft); border: 1px solid var(--hair); font-weight: 700; font-size: 15px; color: var(--slate-700); }
    .pill svg { color: var(--accent); }
    .count { font-family: 'JetBrains Mono'; font-size: 12.5px; color: var(--slate-500); }

    /* ── 7. Dark panel left + compact cards right ── */
    .v7 { display: grid; grid-template-columns: 0.95fr 1.05fr; gap: 18px; align-items: stretch; }
    .v7-panel { position: relative; overflow: hidden; border-radius: 30px; background: var(--ink); color: #fff; padding: 52px 48px 0; display: flex; flex-direction: column; }
    .v7-panel::before { content: ''; position: absolute; right: -180px; top: -180px; width: 520px; height: 520px; background: radial-gradient(closest-side, rgba(112,71,235,.5), transparent 70%); }
    .v7-panel > * { position: relative; }
    .v7-panel h2 { font-size: 40px; }
    .v7-panel .lead { color: rgba(255,255,255,.66); }
    .v7-panel .pills { justify-content: flex-start; margin-top: 26px; gap: 8px; }
    .v7-panel .pill { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.14); color: #fff; font-size: 13.5px; padding: 8px 14px; }
    .v7-panel .pill svg { color: #B9A6FF; }
    .v7-shot { margin-top: auto; padding-top: 40px; }
    .v7-shot img { border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.35); }
    .v7-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .v7-card { border: 1px solid var(--hair); border-radius: 22px; padding: 26px; background: #fff; }
    .v7-card h3 { display: flex; align-items: center; gap: 12px; font-family: 'Poppins'; font-weight: 600; font-size: 17px; margin: 0; }
    .v7-card .ic { width: 40px; height: 40px; }
    .v7-card ul { margin-top: 16px; display: grid; gap: 9px; }
    .v7-card li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; color: var(--slate-700); }

    /* ── 8. Accordion: first open ── */
    .v8 .grid { margin-top: 52px; display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 1080px; margin-left: auto; margin-right: auto; }
    .v8 .row { border: 1px solid var(--hair); border-radius: 20px; background: #fff; }
    .v8 .row-head { display: grid; grid-template-columns: 56px 1fr auto 36px; align-items: center; gap: 16px; padding: 20px 26px; }
    .v8 .num { font-family: 'JetBrains Mono'; font-size: 14px; color: var(--accent); }
    .v8 .row-head h3 { display: flex; align-items: center; gap: 14px; font-family: 'Poppins'; font-weight: 600; font-size: 19px; margin: 0; }
    .v8 .tog { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; color: var(--slate-900); font-size: 20px; line-height: 1; }
    .v8 .row.open { background: var(--accent-soft); border-color: #E2D9FC; }
    .v8 .row.open .tog { background: var(--accent); color: #fff; }
    .v8 .row.open .ic { background: #fff; }
    .v8 .row-body { padding: 0 26px 26px 98px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px; }
    .v8 .row-body li { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--slate-700); }
    .v8 .row-body .tick { background: #fff; }
    .v8 .pills { margin-top: 36px; }

    /* ── 9. Carousel of tall colour cards ── */
    .v9-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
    .v9-head > div:first-child { max-width: 760px; }
    .v9-head h2 { font-size: 44px; max-width: 22ch; }
    .v9-head .lead { max-width: 46ch; }
    .v9-nav { display: flex; gap: 10px; }
    .v9-nav span { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--hair); display: grid; place-items: center; color: var(--slate-900); }
    .v9-nav span.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .v9-track { margin-top: 44px; display: flex; gap: 18px; margin-right: calc((1272px - 100vw) / 2 - 24px); }
    .v9-card { flex: 0 0 340px; min-height: 420px; border-radius: 26px; padding: 30px; display: flex; flex-direction: column; }
    .v9-card .top { display: flex; align-items: center; justify-content: space-between; }
    .v9-card .ic { background: rgba(255,255,255,.7); }
    .v9-card h3 { font-family: 'Poppins'; font-weight: 600; font-size: 24px; letter-spacing: -.01em; margin: 26px 0 0; }
    .v9-card ul { margin-top: 0; padding-top: 26px; display: grid; gap: 10px; }
    .v9-card li { padding: 11px 14px; border-radius: 12px; background: rgba(255,255,255,.72); font-family: 'Inter'; font-weight: 500; font-size: 14px; color: var(--slate-900); }
    .t0 { background: #E9E3FD; } .t0 .ic { color: #6D4BD8; }
    .t1 { background: #E3ECFF; } .t1 .ic { color: #2563EB; }
    .t2 { background: #DDF4F1; } .t2 .ic { color: #0D9488; }
    .t3 { background: #FDF1D3; } .t3 .ic { color: #B45309; }
    .t4 { background: #FAE3F6; } .t4 .ic { color: #A21CAF; }
    .t5 { background: #FFE6DC; } .t5 .ic { color: #C2410C; }
    .v9-dots { margin-top: 26px; display: flex; gap: 6px; }
    .v9-dots i { width: 8px; height: 8px; border-radius: 999px; background: #D4D4D8; }
    .v9-dots i.on { width: 26px; background: var(--accent); }

    /* ── 10. Screenshot hub with callouts ── */
    .v10 { background: var(--soft); border-radius: 32px; padding: 72px 56px; }
    .v10-hub { margin-top: 52px; display: grid; grid-template-columns: 1fr 1.75fr 1fr; gap: 22px; align-items: center; }
    .v10-col { display: grid; gap: 16px; }
    .v10-call { background: #fff; border: 1px solid var(--hair); border-radius: 18px; padding: 18px 20px; box-shadow: 0 8px 22px rgba(15,23,42,.04); }
    .v10-call h3 { display: flex; align-items: center; gap: 12px; font-family: 'Poppins'; font-weight: 600; font-size: 16px; margin: 0; }
    .v10-call .ic { width: 38px; height: 38px; border-radius: 10px; }
    .v10-call .ic svg { width: 18px; height: 18px; }
    .v10-call p { margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: var(--slate-600); }
    .v10-screen { position: relative; background: #fff; border-radius: 22px; padding: 12px; box-shadow: 0 40px 90px rgba(20,16,46,.18); }
    .v10-screen img { border-radius: 14px; }
    .v10-screen::after { content: 'Live from WooCommerce'; position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: #fff; font-family: 'Inter'; font-weight: 600; font-size: 13px; padding: 9px 16px; border-radius: 999px; }
    .v10 .pills { margin-top: 56px; }
    .v10 .pill { background: #fff; }
  </style>
</head>
<body>
  <section class="opt" id="o7">
    <div class="opt-label"><b>7</b> Split · dark panel with heading + dashboard screenshot · compact cards right</div>
    <div class="wrap v7">
      <div class="v7-panel">
        <div data-head></div>
        <div class="pills" data-render="pills"></div>
        <div class="v7-shot"><img src="/src/assets/hero-dashboard.png" alt=""></div>
      </div>
      <div class="v7-cards" data-render="compact"></div>
    </div>
  </section>

  <section class="opt" id="o8">
    <div class="opt-label"><b>8</b> Accordion · numbered categories · first one open</div>
    <div class="wrap v8">
      <div class="center" data-head></div>
      <div class="grid" data-render="accordion"></div>
      <div class="pills" data-render="pills"></div>
    </div>
  </section>

  <section class="opt" id="o9">
    <div class="opt-label"><b>9</b> Carousel · tall colour-coded cards running off the edge · arrows</div>
    <div class="wrap v9">
      <div class="v9-head">
        <div data-head></div>
        <div class="v9-nav" aria-hidden="true">
          <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></span>
          <span class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
        </div>
      </div>
      <div class="v9-track" data-render="carousel"></div>
      <div class="v9-dots"><i class="on"></i><i></i><i></i><i></i></div>
    </div>
  </section>

  <section class="opt" id="o10">
    <div class="opt-label"><b>10</b> Screenshot hub · vendor dashboard centre · six category callouts around it</div>
    <div class="wrap v10">
      <div class="center" data-head></div>
      <div class="v10-hub">
        <div class="v10-col" data-render="callLeft"></div>
        <div class="v10-screen"><img src="/src/assets/hero-dashboard.png" alt=""></div>
        <div class="v10-col" data-render="callRight"></div>
      </div>
      <div class="pills" data-render="pills"></div>
    </div>
  </section>

  <script>
    const TITLE = "A full WooCommerce POS behind every counter";
    const LEAD = "Products, customers, orders and stock all come from your WooCommerce store, synced in real time.";
    const ICONS = {
      barcode: '<path d="M4 5v14M7 5v14M10 5v14M14 5v14M17 5v14M20 5v14"/>',
      card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/>',
      store: '<path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
      chart: '<path d="M4 4v16h16"/><path d="m7 15 4-4 3 3 5-6"/>',
      printer: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
    };
    const GROUPS = [
      { icon: "barcode", t: "Fast checkout", items: ["Barcode scanning", "Multiple live carts", "Carts saved across devices", "Sell by weight", "Coupons and discounts"] },
      { icon: "card", t: "Payments", items: ["Cash payments", "Card and WooCommerce gateways", "Automatic tax calculation", "POS fee tax"] },
      { icon: "store", t: "Outlets and staff", items: ["Unlimited outlets", "Unlimited counters and cashiers", "Login with outlet and counter selection"] },
      { icon: "bell", t: "Stock", items: ["Low and out-of-stock alerts", "Out-of-stock protection", "Quick Edit for stock, price, categories and tags"] },
      { icon: "chart", t: "Reports", items: ["Sales dashboard with charts", "Payment summaries", "Filter by date, cashier, outlet and status", "Printable reports and CSV export"] },
      { icon: "printer", t: "Receipts and orders", items: ["Advanced receipt builder", "One-click print from order tables", "Detailed order view", "Conditional refunds"] },
    ];
    const EXTRAS = ["Unlimited products", "Unlimited customers", "HPOS support", "Light, dark or system mode"];
    const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
    const ic = (k) => `<span class="ic">${svg(k)}</span>`;
    const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    const tick = `<span class="tick">${CHECK}</span>`;
    const n = (i) => String(i + 1).padStart(2, "0");
    const feat = (g) => `${g.items.length} features`;
    const call = (g) => `<div class="v10-call"><h3>${ic(g.icon)}${g.t}</h3><p>${g.items.join(" · ")}</p></div>`;

    const R = {
      pills: () => EXTRAS.map((x) => `<span class="pill">${CHECK}${x}</span>`).join(""),
      compact: () => GROUPS.map((g) => `<div class="v7-card"><h3>${ic(g.icon)}${g.t}</h3><ul>${g.items.map((x) => `<li>${tick}${x}</li>`).join("")}</ul></div>`).join(""),
      accordion: () => GROUPS.map((g, i) => `<div class="row ${i === 0 ? "open" : ""}"><div class="row-head"><span class="num">${n(i)}</span><h3>${ic(g.icon)}${g.t}</h3><span class="count">${feat(g)}</span><span class="tog">${i === 0 ? "−" : "+"}</span></div>${i === 0 ? `<ul class="row-body">${g.items.map((x) => `<li>${tick}${x}</li>`).join("")}</ul>` : ""}</div>`).join(""),
      carousel: () => GROUPS.map((g, i) => `<div class="v9-card t${i}"><div class="top">${ic(g.icon)}<span class="count">${n(i)} / 06</span></div><h3>${g.t}</h3><ul>${g.items.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join(""),
      callLeft: () => GROUPS.slice(0, 3).map(call).join(""),
      callRight: () => GROUPS.slice(3).map(call).join(""),
    };
    document.querySelectorAll("[data-head]").forEach((el) => {
      const v7 = el.closest(".v7-panel"), v9 = el.closest(".v9-head");
      const size = v7 ? 40 : v9 ? 44 : 44;
      el.innerHTML = `<h2 style="font-size:${size}px">${TITLE}</h2><p class="lead">${LEAD}</p>`;
    });
    document.querySelectorAll("[data-render]").forEach((el) => { el.innerHTML = R[el.dataset.render](); });

    // ?only=7 shows a single option (used to export one image per option)
    const only = new URLSearchParams(location.search).get("only");
    if (only) {
      document.body.classList.add("single");
      document.querySelectorAll(".opt").forEach((s) => { if (s.id !== "o" + only) s.remove(); });
    }
  </script>
</body>
</html>
